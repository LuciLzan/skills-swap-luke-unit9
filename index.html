<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SkillSwap</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
<header>
    <div class="site-name">
        <h1>SkillSwap</h1>
    </div>
    <nav>
        <ul class="nav-links">
            <li><a href="#">Home</a></li>
            <li><a href="#">Browse Skills</a></li>
            <li><a href="#">Offer Skills</a></li>
            <li><a href="#">About</a></li>
        </ul>
    </nav>
</header>

<main>
    <section class="hero">
        <h2>Exchange Skills, Build Connections</h2>
        <p>Learn something new or share your expertise with others.</p>
        <button>Get Started</button>
    </section>

    <section class="match-section">
        <h2>Find My Match</h2>

        <div class="match-form">
            <label>
                Category:
                <select id="match-category">
                    <option value="all">All</option>
                    <option value="Programming">Programming</option>
                    <option value="Music">Music</option>
                    <option value="Career">Career</option>
                </select>
            </label>

            <label>
                Max Price ($/hr):
                <input type="number" id="match-price" placeholder="Enter max price" />
            </label>

            <button id="match-btn">Find Matches</button>
        </div>

        <div id="match-results" class="match-results"></div>
    </section>

    <section class="skills">
        <h2>Available Tutoring Skills</h2>

        <!-- Filter Buttons -->
        <div class="filter-buttons">
            <button data-category="all">All</button>
            <button data-category="Programming">Programming</button>
            <button data-category="Music">Music</button>
            <button data-category="Career">Career</button>
        </div>

        <div class="skills-grid" id="skills-container">
        </div>
    </section>
    <section class="calculator">
        <h2>Cost Calculator</h2>

        <div class="calculator-form">
            <label>
                Hourly Rate ($):
                <input type="number" id="rate" placeholder="Enter rate" />
            </label>

            <label>
                Hours:
                <input type="number" id="hours" placeholder="Enter hours" />
            </label>

            <button id="calculate-btn">Calculate Total</button>

            <p id="total-result">Total: $0</p>
        </div>
    </section>

</main>
<footer>
    <p>&copy; 2026 SkillSwap. All rights reserved.</p>
</footer>

<script src="api-service.js"></script>
<script src="skillswap-functions.js"></script>
<script src="script.js"></script>
</body>
</html>
